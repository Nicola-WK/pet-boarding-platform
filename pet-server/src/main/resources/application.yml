server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: pet-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pet_boarding?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: ${JWT_ISSUER}
    ttl: ${JWT_TTL:PT168H}
  admin:
    openids: ${ADMIN_OPENIDS:}
wechat:
  miniapp:
    app-id: ${WECHAT_APP_ID}
    secret: ${WECHAT_APP_SECRET}
